<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swanson Design — Project</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#202020;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.bar{height:58px;width:100%;background:#262626;display:flex;align-items:center;gap:20px;padding:0 18px;box-sizing:border-box;position:relative;z-index:10}
.logo{font-size:12px;letter-spacing:.2em;white-space:nowrap}
.title{font-size:13px;color:#ddd;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid #777;background:transparent;color:#fff;text-decoration:none;font-size:10px;letter-spacing:.14em;padding:10px 12px;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:#fff;color:#222}
body:fullscreen,body:-webkit-full-screen{width:100vw;height:100vh}
.viewer{width:100%;height:calc(100vh - 58px);position:relative;background:#333;overflow:hidden}
.viewer iframe{width:100%;height:100%;border:0;background:#fff;display:block}
body:fullscreen .viewer,body:-webkit-full-screen .viewer{height:calc(100vh - 58px)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#222;text-align:center}
.fallback p{color:#bbb;font-size:13px}
@media (max-width:700px){.bar{gap:10px;padding:0 10px}.logo{font-size:10px}.title{font-size:11px}.btn{font-size:9px;padding:8px 9px}}
</style>
</head>
<body>
<div class="bar">
<div class="logo">SWANSON DESIGN</div>
<div class="title" id="title">Loading…</div>
<a class="btn" href="index.html">BACK TO MATERIALS</a>
<button class="btn" id="fs" type="button">FULL SCREEN</button>
</div>
<div class="viewer" id="viewer">
<iframe id="pdf" allow="fullscreen" title="Project PDF"></iframe>
<div class="fallback" id="fallback">
<p>Your browser may not display the PDF inside this viewer.</p>
<a class="btn" id="open" target="_blank" rel="noopener">OPEN PDF</a>
</div>
</div>
<script>
fetch("projects.json")
.then(response=>{if(!response.ok)throw new Error("Unable to load projects.json");return response.json()})
.then(projects=>{
const id=new URLSearchParams(window.location.search).get("id");
const project=projects.find(item=>item.slug===id)||projects[0];
if(!project)throw new Error("Project not found");
document.title="Swanson Design — "+project.title;
document.getElementById("title").textContent=project.title;
document.getElementById("open").href=project.dropbox;
const pdfURL=new URL(project.dropbox);
pdfURL.searchParams.set("raw","1");
pdfURL.hash="zoom=page-width";
document.getElementById("pdf").src=pdfURL.toString();
})
.catch(error=>{
console.error(error);
document.getElementById("title").textContent="Project unavailable";
document.getElementById("fallback").style.display="flex";
});
const fullscreenButton=document.getElementById("fs");
fullscreenButton.addEventListener("click",async()=>{
try{
if(!document.fullscreenElement){
await document.documentElement.requestFullscreen();
}else{
await document.exitFullscreen();
}
}catch(error){console.error("Fullscreen request failed:",error)}
});
document.addEventListener("fullscreenchange",()=>{
fullscreenButton.textContent=document.fullscreenElement?"EXIT FULL SCREEN":"FULL SCREEN";
});
</script>
</body>
</html>
